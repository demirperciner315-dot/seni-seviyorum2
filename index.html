<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seni Seviyorum ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #080008;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    cursor: pointer;
}

.container {
    text-align: center;
}

.heart {
    font-size: 110px;
    animation: beat 1s infinite;
    filter: drop-shadow(0 0 25px #ff1744);
}

.text {
    color: white;
    font-size: 45px;
    font-weight: bold;
    opacity: 0;
    transform: scale(0);
    text-shadow: 0 0 15px #ff1744, 0 0 30px #ff1744;
}

.show {
    animation: appear 1s forwards;
}

@keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

@keyframes appear {
    0% {
        opacity: 0;
        transform: scale(0);
    }
    60% {
        opacity: 1;
        transform: scale(1.25);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}

.particle {
    position: fixed;
    font-size: 25px;
    pointer-events: none;
    animation: explode 1.5s ease-out forwards;
}

@keyframes explode {
    from {
        transform: translate(0, 0) scale(1);
        opacity: 1;
    }
    to {
        transform: translate(var(--x), var(--y)) rotate(360deg) scale(0);
        opacity: 0;
    }
}
</style>
</head>

<body onclick="love()">

<div class="container">
    <div class="heart">❤️</div>
    <div id="text" class="text">Seni Seviyorum ❤️</div>
</div>

<script>
function love() {

    document.getElementById("text").classList.add("show");

    for (let i = 0; i < 80; i++) {

        const particle = document.createElement("div");

        particle.className = "particle";
        particle.innerHTML = Math.random() > 0.5 ? "❤️" : "💕";

        particle.style.left = "50%";
        particle.style.top = "45%";

        const x = (Math.random() - 0.5) * 700;
        const y = (Math.random() - 0.5) * 600;

        particle.style.setProperty("--x", x + "px");
        particle.style.setProperty("--y", y + "px");

        document.body.appendChild(particle);

        setTimeout(() => {
            particle.remove();
        }, 1500);
    }
}
</script>

</body>
</html>
